indexpage:
  title: Documentación de Novus
  summary: NetApp Novus es una solución de almacenamiento definido por software diseñada
    para satisfacer las necesidades específicas de los clientes con computación a
    exaescala y fábricas de IA a escala de gigavatios. Se apoya en una arquitectura
    basada en NFS paralelo (pNFS) con servidores de datos ONTAP. Novus está diseñado
    principalmente para entornos de nube e hiperescaladores; reduce la latencia y
    los cuellos de botella, mantiene las GPU ocupadas y mejora drásticamente el rendimiento
    y la escalabilidad.
  keywords: novus, netapp novus, ontap data server, nfs, parallel nfs, pnfs, mds
